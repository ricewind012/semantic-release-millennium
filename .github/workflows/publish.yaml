name: Publish

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - parallel:
        - name: Checkout
          uses: actions/checkout@v7

        - name: Setup Bun
          uses: oven-sh/setup-bun@v2

      - name: Publish package
        run: bun x jsr publish
